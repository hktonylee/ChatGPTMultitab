name: Unit Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run Electron navigation checks (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron -- --no-sandbox

      - name: Run Electron navigation checks (macOS)
        if: runner.os == 'macOS'
        run: npm run test:electron
